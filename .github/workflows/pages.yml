name: Deploy LifeUK to Pages

on:
  push:
    branches: ["main", "audit/progress-20261004"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lifeuk-pages-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Two clean regression passes on the actual entrypoint and all exam data
        run: |
          node --check app.js
          node --check session-core.js
          node --check app-v17.js
          for pass in 1 2; do
            node --test tests/session.test.cjs
            QA_ROUND=$pass python tests/browser_smoke.py
          done
      - name: Retain browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeuk-browser-audit
          path: |
            qa-output/*.png
            qa-output/browser-round*.json

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
